<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>11.2 导体的电阻（可视化版） · 可交互课件</title>
<style>
  :root{
    --bg:#000; --bar:#0a0a0a; --panel:#0e0e0e; --line:#242424; --sep:#383838;
    --btn:#141414; --btnH:#1e1e1e; --btnM:#1a1a1a; --tick:#4a4a4a; --dim:#B0B0B0;
    --pos:#E06A96; --neg:#0E8A96; --gold:#F0AC5F;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:#fff;
    font-family:"Microsoft YaHei","PingFang SC","Noto Sans SC","WenQuanYi Zen Hei",sans-serif;
    -webkit-font-smoothing:antialiased}
  body{display:flex;flex-direction:column;overflow:hidden}
  /* ---------- 顶栏 ---------- */
  header{flex:0 0 auto;background:var(--bar);border-bottom:1px solid var(--line);
    padding:8px 14px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  header h1{margin:0;font-size:16px;font-weight:600;letter-spacing:.2px;white-space:nowrap}
  header .act{font-size:12.5px;color:var(--neg);border:1px solid #1b4a52;border-radius:3px;padding:2px 8px;white-space:nowrap}
  header .ttl{font-size:15px;font-weight:600;color:#fff;flex:1 1 auto;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  header .cnt{font-size:12.5px;color:var(--dim);font-variant-numeric:tabular-nums;white-space:nowrap}
  /* ---------- 导航条 ---------- */
  nav{flex:0 0 auto;background:var(--bar);border-bottom:1px solid var(--line);
    padding:5px 12px;display:flex;gap:10px;overflow-x:auto;scrollbar-width:thin}
  nav .grp{display:flex;align-items:center;gap:4px;flex:0 0 auto}
  nav .glab{font-size:11.5px;color:#6a6a6a;margin-right:3px;white-space:nowrap}
  nav .tk{width:24px;height:22px;line-height:20px;text-align:center;font-size:12px;
    background:var(--btn);color:#c8c8c8;border:1px solid var(--line);border-radius:3px;
    cursor:pointer;padding:0;font-variant-numeric:tabular-nums}
  nav .tk:hover{background:var(--btnH)}
  nav .tk.on{background:#3a2a12;border-color:var(--gold);color:var(--gold);font-weight:700}
  /* ---------- 主体 ---------- */
  main{flex:1 1 auto;display:flex;min-height:0}
  .stagewrap{flex:1 1 auto;position:relative;min-width:0;background:#000}
  canvas#stage{display:block;width:100%;height:100%;cursor:ew-resize}
  aside{flex:0 0 272px;background:var(--panel);border-left:1px solid var(--line);
    padding:12px 13px;overflow-y:auto;font-size:12.5px;line-height:1.62}
  aside h2{margin:0 0 8px;font-size:12px;font-weight:600;color:#7a7a7a;letter-spacing:.6px}
  aside .sec{border-top:1px solid var(--sep);margin:12px -13px 0;padding:11px 13px 0}
  aside .sec:first-child{border-top:0;margin-top:0;padding-top:0}
  #pFormula{font-size:13.5px;color:var(--gold);line-height:1.7;word-break:break-word;
    font-family:"Cambria Math","Times New Roman",Georgia,serif}
  #pNote{color:#c4c4c4}
  #pHint{color:var(--dim);font-size:12px}
  .kv{display:flex;justify-content:space-between;gap:8px;padding:2.5px 0;
    border-bottom:1px dotted #1e1e1e;font-variant-numeric:tabular-nums}
  .kv span{color:#8f8f8f}
  .kv b{font-size:12.5px;font-weight:700;color:#fff}
  /* ---------- 底栏 ---------- */
  footer{flex:0 0 auto;background:var(--bar);border-top:1px solid var(--line);padding:8px 12px}
  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .row+.row{margin-top:7px}
  button.b{background:var(--btn);color:#e6e6e6;border:1px solid var(--line);border-radius:3px;
    padding:5px 12px;font-size:13px;cursor:pointer;font-family:inherit}
  button.b:hover{background:var(--btnH)}
  button.b:disabled{opacity:.35;cursor:default}
  button.b.pri{background:var(--btnM);border-color:#3a3a3a}
  button.b.on{background:#102a34;border-color:#2E9FD0;color:#7FD8F5}
  #prog{flex:1 1 140px;height:6px;background:#161616;border-radius:3px;position:relative;cursor:pointer;min-width:90px}
  #progFill{position:absolute;left:0;top:0;bottom:0;background:var(--gold);border-radius:3px;transition:width .18s}
  .ctrl{display:flex;flex-direction:column;gap:3px;min-width:150px;flex:1 1 160px;max-width:250px}
  .ctrl label{display:flex;justify-content:space-between;font-size:11.5px;color:#9a9a9a}
  .ctrl .val{color:var(--gold);font-variant-numeric:tabular-nums;font-weight:600}
  .ctrl input[type=range]{width:100%;height:18px;accent-color:#F0AC5F;background:transparent}
  .ctrl button.tg{width:100%;padding:3px 8px;font-size:12px}
  #controls{display:flex;gap:14px;flex-wrap:wrap;flex:1 1 auto}
  /* ---------- 可点按钮带 ---------- */
  #clickbar{display:flex;gap:8px;flex-wrap:wrap}
  button.b.tap{background:#10202a;border-color:#1f5462;color:#9fe8f7;padding:4px 11px;font-size:12.5px}
  button.b.tap:hover{background:#16303d}
  button.b.tap.alt{background:#241a10;border-color:#5c4520;color:#f0c78a}
  button.b.tap.alt:hover{background:#2f2214}
  #pClick{color:#d8d8d8}
  #pClick b{font-size:11.5px;letter-spacing:.5px}
  #pTap{color:#9a9a9a;font-size:12px}
  /* ---------- 窄屏 ---------- */
  @media (max-width:760px){
    header{padding:6px 10px;gap:8px}
    header h1{font-size:13.5px}
    header .ttl{font-size:13px;flex-basis:100%;order:9}
    aside{flex:0 0 auto;max-height:34vh;border-left:0;border-top:1px solid var(--line);
      padding:10px;font-size:12px}
    main{flex-direction:column}
    .stagewrap{flex:1 1 44vh;min-height:220px}
    #pNote{max-height:8.5em;overflow-y:auto}
    .ctrl{min-width:120px;max-width:none}
    footer{padding:6px 9px}
    button.b{padding:5px 9px;font-size:12.5px}
  }
</style>
</head>
<body>
<header>
  <h1>11.2 导体的电阻</h1>
  <span class="act" id="hAct">—</span>
  <span class="ttl" id="hTitle">—</span>
  <span class="cnt" id="hCount">—</span>
</header>
<nav id="toc" aria-label="步骤导航"></nav>
<main>
  <div class="stagewrap"><canvas id="stage"></canvas></div>
  <aside>
    <div class="sec"><h2>本步读数</h2><div id="readout"></div></div>
    <div class="sec" id="secClick"><h2>点选反馈</h2><div id="pClick"></div></div>
    <div class="sec"><h2>公式</h2><div id="pFormula"></div></div>
    <div class="sec"><h2>说明</h2><div id="pNote"></div></div>
    <div class="sec"><h2>怎么用</h2><div id="pHint"></div></div>
    <div class="sec"><h2>这一步画布上能点</h2><div id="pTap"></div></div>
    <div class="sec"><h2>操作</h2>
      <div class="row" style="font-size:11.5px;color:#8f8f8f">
        键盘：← → 翻步 · R 复位 · Home/End 首末步 · 空格 播放/暂停 · S 停止<br>
        画布：点对象 = 看讲解 · 左右拖动 = 拖本步的第一个连续量<br>
        <b style="color:#05E8FD">动画是自动播的</b>：不拖也在走；你一拖一停，它就让位 3.5 s 再来
      </div>
    </div>
  </aside>
</main>
<footer>
  <div class="row" id="clickbar"></div>
  <div class="row" id="controls"></div>
  <div class="row">
    <button class="b" id="btnPrev">◀ 上一步</button>
    <button class="b pri" id="btnNext">下一步 ▶</button>
    <button class="b" id="btnReset">↺ 复位本步</button>
    <button class="b" id="btnPlay" title="播放 / 暂停（空格）">❚❚ 暂停</button>
    <button class="b" id="btnStop" title="停止并回到初始状态（S）">■ 停止</button>
    <button class="b" id="btnSpeed" title="切换动画倍速">1.0×</button>
    <div id="prog"><div id="progFill"></div></div>
  </div>
</footer>
<script>

(function (global) {
  'use strict';

  var RHO = {
    '银': 1.6e-8, '铜': 1.7e-8, '铝': 2.9e-8, '钨': 5.3e-8,
    '铁': 1.0e-7, '锰铜合金': 4.4e-7, '镍铜合金': 5.0e-7, '镍铬合金': 1.0e-6
  };
  var RHO_ORDER = ['银', '铜', '铝', '钨', '铁', '锰铜合金', '镍铜合金', '镍铬合金'];
  var ALPHA_W = 4.5e-3;
  var TEMP_ROOM = 20;

  function fmt(x, n) {
    if (!isFinite(x)) return '—';
    n = n == null ? 2 : n;
    if (x !== 0 && (Math.abs(x) < 1e-3 || Math.abs(x) >= 1e5)) return sci(x, n);
    return Number(x.toFixed(n)).toString();
  }
  function sci(x, n) {
    if (!isFinite(x)) return '—';
    n = n == null ? 2 : n;
    if (x === 0) return '0';
    var e = Math.floor(Math.log(Math.abs(x)) / Math.LN10);
    var m = x / Math.pow(10, e);
    if (Math.abs(m) >= 10) { m /= 10; e += 1; }
    return Number(m.toFixed(n)) + '×10' + sup(e);
  }
  var SUPS = { '0': '⁰', '1': '¹', '2': '²', '3': '³', '4': '⁴', '5': '⁵', '6': '⁶', '7': '⁷', '8': '⁸', '9': '⁹', '-': '⁻' };
  function sup(n) { return String(n).split('').map(function (c) { return SUPS[c] || c; }).join(''); }

  function currentLinear(U, R) { return R > 0 ? U / R : 0; }

  function ratioUI(U, I) { return I > 0 ? U / I : 0; }

  function slopeUI(R) { return R; }
  function slopeIU(R) { return R > 0 ? 1 / R : 0; }

  function resistanceRatioFromCurrent(I1, I2) { return I2 > 0 ? I1 / I2 : 0; }

  function resistanceRatioFromVoltage(U1, U2) { return U2 > 0 ? U1 / U2 : 0; }

  function resistanceFromRho(rho, L, S) { return rho * L / S; }

  function rhoFromR(rR, S, L) { return L > 0 ? rR * S / L : 0; }

  function resistanceByLength(rho, L, S) { return resistanceFromRho(rho, L, S); }

  function resistanceByArea(rho, L, S) { return resistanceFromRho(rho, L, S); }

  function stretchFactor(L, L2) { return Math.pow(L2 / L, 2); }

  function areaAfterStretch(S, L, L2) { return L2 > 0 ? S * L / L2 : 0; }

  function relativeR(L1, S1, rho1, L0, S0, rho0) {
    return (L1 / L0) * (rho1 / rho0) / (S1 / S0);
  }

  function rheostatR(rho, Ltotal, S, x) {
    var xx = x < 0 ? 0 : (x > 1 ? 1 : x);
    return resistanceFromRho(rho, Ltotal * xx, S);
  }

  function rheostatLength(Ltotal, x) {
    var xx = x < 0 ? 0 : (x > 1 ? 1 : x);
    return Ltotal * xx;
  }

  function rhoAtTemp(rho0, alpha, tC, t0C) {
    return rho0 * (1 + alpha * (tC - (t0C == null ? TEMP_ROOM : t0C)));
  }

  function filamentR(R0, alpha, tC, t0C) { return rhoAtTemp(R0, alpha, tC, t0C); }

  function rhoSemiAtTemp(rho0, beta, tC, t0C) {
    var r = rho0 * (1 - beta * (tC - (t0C == null ? TEMP_ROOM : t0C)));
    return r < rho0 * 0.02 ? rho0 * 0.02 : r;
  }

  function currentAfterHeat(I0, R0, alpha, dT) {
    var R2 = filamentR(R0, alpha, TEMP_ROOM + dT, TEMP_ROOM);
    return R2 > 0 ? I0 * R0 / R2 : I0;
  }

  function lampCurrent(U, R0, Uc) {
    var f = 1 + Math.pow(U / (Uc || 2.0), 2);
    return U / (R0 * Math.sqrt(f));
  }

  function lampR(U, R0, Uc) { return R0 * Math.sqrt(1 + Math.pow(U / (Uc || 2.0), 2)); }

  function isLinearDevice(R1, R2, tol) {
    return Math.abs(R1 - R2) <= (tol == null ? 1e-9 : tol);
  }

  function diodeCurrent(U, Uth, k) {
    if (U <= 0) return 0;
    var a = (U - (Uth == null ? 0.6 : Uth)) / (k == null ? 0.08 : k);
    return 1e-3 * Math.exp(Math.min(a, 20));
  }

  function seriesVoltageRatio(R1, R2) { return R2 > 0 ? R1 / R2 : 0; }

  function onlyOneDiffers(pair1, pair2) {
    var keys = ['L', 'S', 'material'], d = 0;
    for (var i = 0; i < keys.length; i++) if (pair1[keys[i]] !== pair2[keys[i]]) d++;
    return d === 1;
  }

  function saltColumnR(R, L1, L2) { return R * stretchFactor(L1, L2); }

  function blockR_AB(rho, a, b, c) { return resistanceFromRho(rho, a, b * c); }
  function blockR_CD(rho, a, b, c) { return resistanceFromRho(rho, b, a * c); }

  function lampRatedR(U, I) { return I > 0 ? U / I : 0; }
  function leadWireR(rho, L, S) { return resistanceFromRho(rho, L, S); }

  function voltageLoss(I, rho, L, S) { return I * resistanceFromRho(rho, L, S); }

  function birdVoltage(I, rho, L, S) { return I * resistanceFromRho(rho, L, S); }

  function runSelfTest() {
    var R = [], fails = [];
    function chk(name, got, want, tol) {
      var ok = Math.abs(got - want) <= (tol == null ? 0 : tol);
      R.push({ name: name, got: got, want: want, ok: ok });
      if (!ok) fails.push(R[R.length - 1]);
    }
    function chkT(name, cond, got) {
      var ok = !!cond;
      R.push({ name: name, got: got == null ? (ok ? '✓' : '✗') : got, want: 'true', ok: ok });
      if (!ok) fails.push(R[R.length - 1]);
    }

    chk('R = U/I：6 V、2 A ⇒ 3 Ω', ratioUI(6, 2), 3, 1e-12);
    chk('同一导体：U 加倍 I 加倍 ⇒ U/I 不变',
      ratioUI(12, currentLinear(12, 3)), ratioUI(6, currentLinear(6, 3)), 1e-12);
    chk('U-I 图斜率 = R', slopeUI(5), 5, 0);
    chk('I-U 图斜率 = 1/R', slopeIU(5), 0.2, 1e-15);
    chk('U 相同时 R₁/R₂ = I₂/I₁', resistanceRatioFromCurrent(0.5, 0.25), 2, 1e-12);
    chk('串联时 R₁/R₂ = U₁/U₂', resistanceRatioFromVoltage(1.5, 3.0), 0.5, 1e-12);
    chkT('R 与 U、I 无关（比值定义）', ratioUI(3, 1) === ratioUI(300, 100), 'R 恒为 3 Ω');

    chk('R = ρL/S：铜 1 m、1 mm²', resistanceFromRho(RHO['铜'], 1, 1e-6), 0.017, 1e-12);
    chk('R ∝ L：L 加倍 ⇒ R 加倍',
      resistanceByLength(RHO['铜'], 2, 1e-6) / resistanceByLength(RHO['铜'], 1, 1e-6), 2, 1e-12);
    chk('R ∝ 1/S：S 加倍 ⇒ R 减半',
      resistanceByArea(RHO['铜'], 1, 2e-6) / resistanceByArea(RHO['铜'], 1, 1e-6), 0.5, 1e-12);
    chk('同 L、同 S、换材料 ⇒ R 之比 = ρ 之比',
      resistanceFromRho(RHO['镍铬合金'], 1, 1e-6) / resistanceFromRho(RHO['铜'], 1, 1e-6),
      RHO['镍铬合金'] / RHO['铜'], 1e-9);
    chk('ρ = RS/L 与 R = ρL/S 互为反解',
      rhoFromR(resistanceFromRho(RHO['铝'], 2, 1e-6), 1e-6, 2), RHO['铝'], 1e-18);
    chk('拉长到 2 倍 ⇒ R 变 4 倍', stretchFactor(0.3, 0.6), 4, 1e-12);
    chk('拉长后体积不变：S\' = S·L/L\'', areaAfterStretch(1e-6, 0.3, 0.4), 0.75e-6, 1e-18);

    chk('只动 L：R/R₀ = L/L₀（L 变 3 倍 ⇒ 3 倍）',
      relativeR(3, 1, 1, 1, 1, 1), 3, 1e-12);
    chk('只动 S：R/R₀ = S₀/S（S 变 2 倍 ⇒ 减半）',
      relativeR(1, 2, 1, 1, 1, 1), 0.5, 1e-12);
    chk('只动材料：R/R₀ = ρ/ρ₀（镍铬/铜 ⇒ 58.82）',
      relativeR(1, 1, RHO['镍铬合金'], 1, 1, RHO['铜']), RHO['镍铬合金'] / RHO['铜'], 1e-12);
    chk('三因素同动：L×2、S×4、换镍铬 ⇒ 2×(58.82)/4 = 29.41',
      relativeR(2, 4, RHO['镍铬合金'], 1, 1, RHO['铜']), 2 * (RHO['镍铬合金'] / RHO['铜']) / 4, 1e-12);
    chk('相对式与绝对式自洽：R = R₀·相对比',
      resistanceFromRho(RHO['铜'], 2, 4e-6) / resistanceFromRho(RHO['铜'], 1, 1e-6),
      relativeR(2, 4, RHO['铜'], 1, 1, RHO['铜']), 1e-12);

    chk('滑片在最左（x=0）⇒ 接入长度 0 ⇒ R = 0', rheostatR(RHO['镍铬合金'], 0.5, 1e-6, 0), 0, 1e-18);
    chk('滑片在最右（x=1）⇒ 接入全长 ⇒ R = ρL/S',
      rheostatR(RHO['镍铬合金'], 0.5, 1e-6, 1), resistanceFromRho(RHO['镍铬合金'], 0.5, 1e-6), 1e-18);
    chk('滑片位置 x 与电阻成正比：x=0.5 ⇒ 一半',
      rheostatR(RHO['镍铬合金'], 0.5, 1e-6, 0.5) / rheostatR(RHO['镍铬合金'], 0.5, 1e-6, 1), 0.5, 1e-12);
    chk('接入长度 L = L_total · x', rheostatLength(0.5, 0.3), 0.15, 1e-15);
    chkT('滑片位置越靠右 ⇒ 接入越长 ⇒ 电阻越大（单调）',
      rheostatR(RHO['镍铬合金'], 0.5, 1e-6, 0.8) > rheostatR(RHO['镍铬合金'], 0.5, 1e-6, 0.4));

    chkT('a 与 b：只有 L 不同', onlyOneDiffers({ L: 1, S: 1, material: 'm' }, { L: 2, S: 1, material: 'm' }));
    chkT('a 与 c：只有 S 不同', onlyOneDiffers({ L: 1, S: 1, material: 'm' }, { L: 1, S: 2, material: 'm' }));
    chkT('a 与 d：只有材料不同', onlyOneDiffers({ L: 1, S: 1, material: 'm' }, { L: 1, S: 1, material: 'n' }));
    chkT('两处不同 ⇒ 不能作因果判据', !onlyOneDiffers({ L: 1, S: 1, material: 'm' }, { L: 2, S: 2, material: 'm' }));
    chk('串联电压比 = 电阻比（a:b = 1:2 ⇒ 2 V:4 V）', seriesVoltageRatio(2, 4), 0.5, 1e-12);

    chk('ρ(20 ℃) 即表值', rhoAtTemp(1.7e-8, 4.5e-3, 20, 20), 1.7e-8, 1e-18);
    chkT('金属加热 ⇒ ρ 变大', rhoAtTemp(1.7e-8, 4.5e-3, 120, 20) > 1.7e-8);
    chkT('半导体加热 ⇒ ρ 变小', rhoSemiAtTemp(1e-3, 8e-3, 120, 20) < 1e-3);
    chkT('加热灯丝 ⇒ 电流变小（灯泡变暗）', currentAfterHeat(0.25, 12, ALPHA_W, 100) < 0.25,
      currentAfterHeat(0.25, 12, ALPHA_W, 100));
    chkT('灯丝 20 ℃ 12 Ω ⇒ 2000 ℃ 约 120 Ω（教参量级）',
      filamentR(12, ALPHA_W, 2000, 20) > 90 && filamentR(12, ALPHA_W, 2000, 20) < 140,
      filamentR(12, ALPHA_W, 2000, 20));

    chkT('线性元件：U-I 是过原点直线（斜率恒定）', isLinearDevice(ratioUI(1, 0.2), ratioUI(5, 1)));
    chkT('小灯泡 I(U) 单调递增', lampCurrent(2.0, 12, 2) > lampCurrent(1.0, 12, 2));
    chkT('小灯泡 R(U) 单调递增（电阻随电压变大）', lampR(2.0, 12, 2) > lampR(1.0, 12, 2));
    chkT('小灯泡曲线严格上凸（I\'\' < 0）', (function () {
      var a = lampCurrent(0.8, 12, 2), b = lampCurrent(1.6, 12, 2), c = lampCurrent(2.4, 12, 2);
      return (b - a) > (c - b);
    })());
    chkT('二极管：反向电压电流为 0', diodeCurrent(-1, 0.6) === 0);
    chkT('二极管：正向超过阈值后电流急升', diodeCurrent(0.9, 0.6) > 10 * diodeCurrent(0.7, 0.6));

    chk('练习1：B、C 在同一条直线上 ⇒ R_B = R_C', resistanceRatioFromCurrent(1, 1), 1, 0);
    chk('练习2：小灯泡 R = 3 V / 0.25 A = 12 Ω', lampRatedR(3, 0.25), 12, 1e-12);
    chk('练习2：10 cm 铜丝（1 mm²）R ≈ 1.7×10⁻³ Ω',
      leadWireR(RHO['铜'], 0.10, 1e-6), 1.7e-3, 1e-9);
    chkT('练习2：导线电阻远小于 12 Ω ⇒ 可以忽略',

      Z.T(ctx, 'I = ' + P.fmt(S.ex4I, 0) + ' A，S = 120 mm²', bxx, y - 60 * k,
        { size: 17 * k, align: 'center', color: K.gold });

    });

    D(ctx, S.r3, function () {
      Z.readoutBox(ctx, mx(L, 0.04), my(L, 0.58), (L.mx1 - L.mx0) * 0.46, [
        ['练习3 R = ρL/S', P.fmt(S.R_ex3, 4) + ' Ω', K.gold],
        ['练习3 损失电压', P.fmt(S.Uloss_ex3, 2) + ' V', K.gold]
      ], { k: k });
      Z.readoutBox(ctx, mx(L, 0.54), my(L, 0.58), (L.mx1 - L.mx0) * 0.44, [
        ['练习4 R = ρL/S', P.sci(S.R_ex4, 2) + ' Ω', K.gold],
        ['练习4 两爪电压', P.sci(S.Ubird_ex4, 2) + ' V', K.neg]
      ], { k: k });
      Z.T(ctx, '同一根导线：越长电阻越大 ⇒ 远距离输电时不能忽略导线电阻',
        mx(L, 0.05), my(L, 0.92), { size: 18 * k, color: K.dim });
    });
  }

  function scTwoViews(ctx, W, H, S) {
    var k = Z.sc(H), L = layout(W, H, {});

    var narrow = W < 700;
    shell(ctx, W, H, S, L, {
      card: narrow ? null : [
        { label: '同一组数据', text: '横轴纵轴换一下，图就换了一个样子 —— 但点还是那些点。' },
        { label: '斜率', text: 'U-I 图（纵 U 横 I）的斜率 = R；I-U 图（横 U 纵 I）的斜率 = 1/R。' },
        { formula: 'R  ⇔  1/R' }
      ]
    });
    var R = S.tvR;
    var Umax = 6, Imax = 2.0;
    function XL(I) { return I / Imax; }
    function YL(U) { return U / Umax; }
    function XR(U) { return U / Umax; }
    function YR(I) { return I / Imax; }
    var U = S.tvU, I = U / R;

    if (narrow) {

      var wN = (L.mx1 - L.mx0) * 0.86;
      var hN = (L.my1 - L.my0) * 0.30;
      var xN = mx(L, 0.08);
      var yTop = my(L, 0.40), yBot = my(L, 0.96);
      var A1 = axes(ctx, xN, yTop, wN, hN, { k: k, xlab: 'I / A', ylab: 'U / V', nx: 4, ny: 3 });
      var A2 = axes(ctx, xN, yBot, wN, hN, { k: k, xlab: 'U / V', ylab: 'I / A', nx: 4, ny: 3 });
      D(ctx, S.r0, function () {
        plotLine(ctx, A1, [[XL(0), YL(0)], [XL(Imax), YL(R * Imax)]], { color: K.gold, w: 2.6, k: k });
        Z.T(ctx, 'U-I 图 · 斜率 = R = ' + P.fmt(R, 2) + ' Ω', xN, my(L, 0.06),
          { size: 17 * k, color: K.gold });
      });
      D(ctx, S.r1, function () {
        plotLine(ctx, A2, [[XR(0), YR(0)], [XR(Umax), YR(Umax / R)]], { color: K.neg, w: 2.6, k: k });
        Z.T(ctx, 'I-U 图 · 斜率 = 1/R = ' + P.fmt(1 / R, 3) + ' A/V', xN, my(L, 0.56),
          { size: 17 * k, color: K.neg });
      });
      D(ctx, S.r2, function () {
        guide(ctx, A1, XL(I), YL(U), { k: k, color: 'rgba(240,172,95,0.40)' });
        dot(ctx, A1, XL(I), YL(U), { color: K.gold, r: 5.4, k: k });
        guide(ctx, A2, XR(U), YR(I), { k: k, color: 'rgba(46,159,208,0.40)' });
        dot(ctx, A2, XR(U), YR(I), { color: K.neg, r: 5.4, k: k });
      });
      return;
    }

    var y0 = my(L, 0.80), hh = (L.my1 - L.my0) * 0.60;
    var wL = (L.mx1 - L.mx0) * 0.42, wR = (L.mx1 - L.mx0) * 0.42;
    var xL = mx(L, 0.10), xR = mx(L, 0.56);
    var AL = axes(ctx, xL, y0, wL, hh, { k: k, xlab: 'I / A', ylab: 'U / V', nx: 5, ny: 5 });
    var AR = axes(ctx, xR, y0, wR, hh, { k: k, xlab: 'U / V', ylab: 'I / A', nx: 5, ny: 5 });

    D(ctx, S.r0, function () {
      plotLine(ctx, AL, [[XL(0), YL(0)], [XL(Imax), YL(R * Imax)]], { color: K.gold, w: 2.8, k: k });
      Z.T(ctx, 'U-I 图（教材图 11.2-1）', xL, my(L, 0.11), { size: 18 * k, color: K.text });
      Z.T(ctx, '斜率 = R = ' + P.fmt(R, 2) + ' Ω', xL, my(L, 0.155), { size: 18 * k, color: K.gold });
    });

    D(ctx, S.r1, function () {
      plotLine(ctx, AR, [[XR(0), YR(0)], [XR(Umax), YR(Umax / R)]], { color: K.neg, w: 2.8, k: k });
      Z.T(ctx, 'I-U 图（教材图 11.2-4，伏安特性曲线）', xR, my(L, 0.11), { size: 18 * k, color: K.text });
      Z.T(ctx, '斜率 = 1/R = ' + P.fmt(1 / R, 3) + ' A/V', xR, my(L, 0.155), { size: 18 * k, color: K.neg });
    });

    D(ctx, S.r2, function () {
      guide(ctx, AL, XL(I), YL(U), { k: k, color: 'rgba(240,172,95,0.40)' });
      dot(ctx, AL, XL(I), YL(U), { color: K.gold, r: 6, k: k });
      guide(ctx, AR, XR(U), YR(I), { k: k, color: 'rgba(46,159,208,0.40)' });
      dot(ctx, AR, XR(U), YR(I), { color: K.neg, r: 6, k: k });

      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,0.22)';
      ctx.lineWidth = 1.2 * k;
      ctx.setLineDash([5 * k, 5 * k]);
      ctx.beginPath();
      ctx.moveTo(AL.px(XL(I)), AL.py(YL(U)));
      ctx.lineTo(AR.px(XR(U)), AR.py(YR(I)));
      ctx.stroke();
      ctx.restore();
    });

    D(ctx, S.r3, function () {
      Z.readoutBox(ctx, mx(L, 0.02), my(L, 0.88), (L.mx1 - L.mx0) * 0.56, [
        ['同一组 (U, I)', P.fmt(U, 2) + ' V, ' + P.fmt(I, 3) + ' A', K.gold],
        ['U / I', P.fmt(U / I, 2) + ' Ω（两张图都给同一个数）']
      ], { k: k });
    });
  }

  function scWireDrag(ctx, W, H, S) {
    var k = Z.sc(H), L = layout(W, H, {});
    var narrow = W < 700;
    shell(ctx, W, H, S, L, {
      card: narrow ? null : [
        { label: '拖它', text: '把导线拉长、拉粗，看电阻怎么变 —— 这就是控制变量法的"本体"。' },
        { label: '定量', text: 'R/R₀ = (L/L₀) · (ρ/ρ₀) / (S/S₀)：三个因素各占一个因子。' },
        { formula: 'R = ρ L / S' }
      ]
    });

    var y = my(L, 0.34);
    var x0 = mx(L, 0.08);
    var LmaxPx = (L.mx1 - L.mx0) * (narrow ? 0.86 : 0.88);
    var rho = P.RHO[P.RHO_ORDER[S.wdMat]];
    var rho0 = P.RHO[P.RHO_ORDER[S.wdMat0]];

    var lenPx = LmaxPx * (S.wdL / 4);
    var thick = (3 + 17 * Math.sqrt(S.wdS / 10)) * k;
    var col = S.wdMat === 1 ? K.gold : (S.wdMat === 7 ? K.negHi : K.text);

    D(ctx, S.r0, function () {

      ctx.save();
      ctx.strokeStyle = 'rgba(255,255,255,0.30)'; ctx.lineWidth = 1.2 * k; ctx.setLineDash([6 * k, 5 * k]);
      ctx.beginPath(); ctx.moveTo(x0, y - 46 * k); ctx.lineTo(x0, y + 46 * k); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x0 + lenPx, y - 46 * k); ctx.lineTo(x0 + lenPx, y + 46 * k); ctx.stroke();
      ctx.restore();
      Z.T(ctx, '接线柱', x0, y + 60 * k, { size: 16 * k, align: 'center', color: K.dim });
      Z.T(ctx, '接线柱', x0 + lenPx, y + 60 * k, { size: 16 * k, align: 'center', color: K.dim });
    });

    D(ctx, S.r1, function () {
      ctx.save();
      ctx.strokeStyle = col; ctx.lineWidth = thick; ctx.lineCap = 'butt';
      ctx.shadowColor = col; ctx.shadowBlur = 6 * k;
      ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x0 + lenPx, y); ctx.stroke();
      ctx.restore();

      ctx.save();
      ctx.strokeStyle = K.dim; ctx.lineWidth = 1.2 * k;
      var yd = y - 60 * k;
      ctx.beginPath(); ctx.moveTo(x0, yd); ctx.lineTo(x0 + lenPx, yd); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x0, yd - 5 * k); ctx.lineTo(x0, yd + 5 * k);
      ctx.moveTo(x0 + lenPx, yd - 5 * k); ctx.lineTo(x0 + lenPx, yd + 5 * k); ctx.stroke();
      ctx.restore();
      Z.T(ctx, 'L = ' + P.fmt(S.wdL, 2) + ' m', x0 + lenPx / 2, yd - 16 * k,
        { size: 18 * k, align: 'center', color: K.text });
      Z.T(ctx, 'S = ' + P.fmt(S.wdS, 1) + ' mm²', x0 + lenPx + 14 * k, y - 20 * k,
        { size: 18 * k, color: K.text });
      Z.T(ctx, '材料：' + P.RHO_ORDER[S.wdMat], x0, y + 96 * k, { size: 18 * k, color: col });

      ctx.save();
      ctx.strokeStyle = col; ctx.lineWidth = 1.6 * k;
      ctx.beginPath(); ctx.arc(x0 + lenPx + 6 * k, y + 40 * k, thick * 0.5 + 2 * k, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
    });

    D(ctx, S.r2, function () {
      var loop = [[x0, y], [x0 + lenPx, y]];
      Z.chargeFlow(ctx, loop, Math.max(4, Math.round(14 * Math.sqrt(S.wdS / 10))), S.flowPhase, { kind: 'neg', r: 3.8 * k });
      Z.trailDot(ctx, loop, S.flowPhase, { r: 4.4, k: k });
    });

    D(ctx, S.r3, function () {
      var bx = mx(L, 0.02), by = my(L, 0.60);
      var rows = [
        ['R / R₀（当前 / 基准）', P.fmt(S.wdRel, 3) + ' ×', K.gold],
        ['长度因子 L/L₀', P.fmt(S.wdL / 1, 2) + ' ×'],
        ['面积因子 S₀/S（面积大 ⇒ 电阻小）', P.fmt(1 / S.wdS, 3) + ' ×'],
        ['材料因子 ρ/ρ₀', P.fmt(rho / rho0, 2) + ' ×'],
        ['R = ρL/S', P.fmt(S.wdR, 4) + ' Ω', K.gold]
      ];
      Z.readoutBox(ctx, bx, by, (L.mx1 - L.mx0) * (narrow ? 0.92 : 0.62), rows, { k: k });
      Z.T(ctx, '三个因子相乘 = 相对电阻（控制变量法的定量形式）',
        bx, by + rows.length * 23 * k + 16 * k, { size: 17 * k, color: K.dim });
    });
  }

  function scRheostat(ctx, W, H, S) {
    var k = Z.sc(H), L = layout(W, H, {});
    var narrow = W < 700;
    shell(ctx, W, H, S, L, {
      card: narrow ? null : [
        { label: '原理', text: '接入电路的是滑片到某一端的**那一段电阻丝**；移动滑片就是改变接入长度。' },
        { label: '依据', text: '由 R ∝ L 可知：接入越长 ⇒ 电阻越大 ⇒ 电路电流越小。' },
        { formula: 'R(x) = ρ · L_总 · x / S' }
      ]
    });

    var bx = mx(L, 0.10), bw = (L.mx1 - L.mx0) * (narrow ? 0.84 : 0.84);
    var by = my(L, narrow ? 0.24 : 0.30), bh = (L.my1 - L.my0) * 0.20;
    var x = S.rhX;
    var rho = P.RHO['镍铬合金'];
    var Rtot = P.rheostatR(rho, 0.50, 0.5e-6, 1);

    D(ctx, S.r0, function () {

      ctx.save();
      ctx.fillStyle = 'rgba(255,255,255,0.06)';
      ctx.fillRect(bx, by - bh / 2, bw, bh);
      ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = 1.4 * k;
      ctx.strokeRect(bx, by - bh / 2, bw, bh);
      ctx.restore();

      var n = 60, segW = bw / n;
      for (var i = 0; i < n; i++) {
        var xx = bx + i * segW + segW * 0.5;
        var on = (i / n) <= x;
        ctx.save();
        ctx.strokeStyle = on ? K.gold : 'rgba(255,255,255,0.30)';
        ctx.lineWidth = on ? 2.4 * k : 1.2 * k;
        if (on) { ctx.shadowColor = K.gold; ctx.shadowBlur = 5 * k; }
        ctx.beginPath(); ctx.moveTo(xx, by - bh / 2 + 4 * k); ctx.lineTo(xx, by + bh / 2 - 4 * k); ctx.stroke();
        ctx.restore();
      }

      if (narrow) {
        Z.T(ctx, '电阻丝（镍铬）', bx, by + bh / 2 + 48 * k, { size: 16 * k, color: K.dim });
      } else {
        Z.T(ctx, '电阻丝（镍铬合金，总长 0.50 m）', bx, by - bh / 2 - 22 * k,
          { size: 17 * k, color: K.dim });
      }
    });

    D(ctx, S.r1, function () {
      var px = bx + bw * x;

      ctx.save();
      ctx.strokeStyle = K.text; ctx.lineWidth = 2.6 * k;
      ctx.beginPath(); ctx.moveTo(px, by - bh / 2 - 34 * k); ctx.lineTo(px, by - bh / 2); ctx.stroke();
      ctx.fillStyle = K.text;
      ctx.fillRect(px - 9 * k, by - bh / 2 - 40 * k, 18 * k, 8 * k);
      ctx.restore();
      Z.T(ctx, '滑片', px, by - bh / 2 - (narrow ? 74 : 56) * k, { size: 17 * k, align: 'center', color: K.text });

      Z.T(ctx, '接入长度 ' + P.fmt(P.rheostatLength(0.50, x), 3) + ' m',
        bx + bw * x / 2, by + bh / 2 + (narrow ? 24 : 22) * k, { size: 17 * k, align: 'center', color: K.gold });

      var yTop = by - bh / 2 - 84 * k;
      Z.wirePath(ctx, [[bx, by - bh / 2], [bx, yTop], [px, yTop], [px, by - bh / 2 - 40 * k]], { w: 2.4 * k });
      ctx.save();
      ctx.strokeStyle = K.text; ctx.lineWidth = 2 * k;
      ctx.beginPath(); ctx.arc(bx + bw * 0.5, yTop, 15 * k, 0, Math.PI * 2); ctx.stroke();
      ctx.restore();
      Z.M(ctx, 'A', bx + bw * 0.5, yTop, { size: 18 * k, align: 'center', color: K.text });
      Z.T(ctx, '电流表（看电流怎么随滑片变）', bx + bw * 0.5, yTop - 30 * k,
        { size: 17 * k, align: 'center', color: K.dim });
    });

    D(ctx, S.r2, function () {
      var px = bx + bw * x;
      var loop = [[bx, by - bh / 2], [bx, by - bh / 2 - 84 * k], [px, by - bh / 2 - 84 * k], [px, by - bh / 2 - 40 * k]];
      Z.chargeFlow(ctx, loop, 10, S.flowPhase, { kind: 'neg', r: 3.8 * k });
    });

    D(ctx, S.r3, function () {
      Z.readoutBox(ctx, mx(L, 0.02), my(L, 0.66), (L.mx1 - L.mx0) * (narrow ? 0.92 : 0.58), [
        ['滑片位置 x', P.fmt(x, 2) + '（0 = 最左）'],
        ['接入长度 L = 0.50 · x', P.fmt(P.rheostatLength(0.50, x), 3) + ' m'],
        ['接入电阻 R = ρL/S', P.fmt(P.rheostatR(rho, 0.50, 0.5e-6, x), 2) + ' Ω', K.gold],
        ['最大电阻（滑片在最右）', P.fmt(Rtot, 2) + ' Ω'],
        ['判据', '接入越长 ⇒ R 越大 ⇒ I 越小']
      ], { k: k });
    });
  }

  var SCENES = {
    intro: scIntro, measure: scMeasure, uiline: scUILine, compare: scCompare,
    twoviews: scTwoViews, invariant: scInvariant, controlvar: scControlVar, lengthlaw: scLengthLaw,
    arealaw: scAreaLaw, materiallaw: scMaterialLaw, rholaw: scRhoLaw,
    wiredrag: scWireDrag, rheostat: scRheostat,
    rhotable: scRhoTable, temp: scTemp, super: scSuper, linear: scLinear,
    nonlinear: scNonlinear, diode: scDiode, chain: scChain, ex12: scEx12,
    ex34: scEx34, ex567: scEx567
  };

  global.RREND = {
    SCENES: SCENES, layout: layout, mx: mx, my: my, shell: shell, tapRing: tapRing,
    fitCanvas: function (cv, ctx) {
      var dpr = Math.min(2, global.devicePixelRatio || 1);
      var r = cv.getBoundingClientRect();
      var W = Math.max(320, Math.round(r.width)), H = Math.max(200, Math.round(r.height));
      cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);

})(typeof window !== 'undefined' ? window : globalThis);

<script>

(function (global) {

  function updatePanel() {
    var def = STEPS[st.step];
    $('hTitle').textContent = def.title;
    $('hAct').textContent = S.actName;
    $('hCount').textContent = (st.step + 1) + ' / ' + STEPS.length;
    $('pNote').innerHTML = def.note;
    $('pFormula').innerHTML = def.formula;
    $('readout').innerHTML = readRows(S).map(function (r) { return kv(r[0], r[1], r[2]); }).join('');
    $('pHint').textContent = def.hint;
    var box = $('pClick');
    if (box) {
      if (CLICK.msg) {
        box.innerHTML = '<b style="color:' + (CLICK.kind === 'quiz' ? '#F0AC5F' : '#05E8FD') + '">' +
          ({ poke: '点了一下', reveal: '揭晓', pick: '选择', quiz: '判断' }[CLICK.kind] || '点选') +
          '</b><br>' + CLICK.msg;
        box.parentNode.style.display = '';
      } else box.parentNode.style.display = 'none';
    }
    var hs = (HD.HOTSPOTS[def.scene] || []);
    $('pTap').innerHTML = hs.length ? hs.map(function (h) { return '· ' + h.label; }).join('<br>')
      : '<span style="color:#8f8f8f">这一步以拖动为主</span>';
    buildControls(def);
    buildClickBar(def);
  }

  var CBAR = {};
  function buildClickBar(def) {
    var hs = (HD.HOTSPOTS[def.scene] || []).slice();
    var sig = st.step + '|' + hs.map(function (h) { return h.act; }).join(',');
    if (CBAR.sig === sig) return;
    CBAR.sig = sig;
    var host = $('clickbar');
    if (!host) return;
    host.innerHTML = '';
    hs.forEach(function (h) {
      var b = document.createElement('button');
      b.className = 'b tap';
      b.textContent = '● ' + h.label;
      b.title = h.note || '';
      b.addEventListener('click', function () {
        var fn = ACT[h.act];
        if (fn) fn(); else { CLICK.kind = 'poke'; CLICK.msg = h.note || ''; draw(); }
      });
      host.appendChild(b);
    });
    if (!hs.length) host.style.display = 'none'; else host.style.display = '';
  }

  var CTRL = {};
  function buildControls(def) {
    var allow = def.allow || {};
    var keys = Object.keys(allow);
    var sig = st.step + '|' + keys.join(',');
    if (CTRL.sig !== sig) {
      CTRL.sig = sig;
      var host = $('controls');
      host.innerHTML = '';
      CTRL.items = {};
      keys.forEach(function (key) {
        var a = allow[key];
        var wrap = document.createElement('div');
        wrap.className = 'ctrl';
        if (a.kind === 'toggle') {
          wrap.innerHTML = '<label><span class="nm">' + a.label + '</span>' +
            '<span class="val" id="cv_' + key + '"></span></label>' +
            '<button class="b tg" id="ci_' + key + '">切换</button>';
          host.appendChild(wrap);
          var btn = wrap.querySelector('button');
          CTRL.items[key] = { a: a, inp: btn, out: wrap.querySelector('.val'), toggle: true };
          btn.addEventListener('click', function () { toggleParam(key); });
        } else {
          wrap.innerHTML = '<label><span class="nm">' + a.label + '</span>' +
            '<span class="val" id="cv_' + key + '"></span></label>' +
            '<input type="range" id="ci_' + key + '" min="' + a.min + '" max="' + a.max + '" step="' + a.step + '">';
          host.appendChild(wrap);
          var inp = wrap.querySelector('input');
          CTRL.items[key] = { a: a, inp: inp, out: wrap.querySelector('.val') };
          inp.addEventListener('input', function () { setParam(key, parseFloat(inp.value)); });
        }
      });
    }
    Object.keys(CTRL.items).forEach(function (key) {
      var it = CTRL.items[key];
      if (!it.toggle) it.inp.value = st[key];
      it.out.textContent = dispOf(key);
    });
  }
  function dispOf(key) {
    var it = CTRL.items[key];
    if (!it) return '';
    if (it.toggle) {
      if (key === 'cvMode') return ['a-b 比长度', 'a-c 比面积', 'a-d 比材料'][st.cvMode];
      if (key === 'heatMat') return st.heatMat ? '金属灯丝' : '铅笔芯（半导体）';
      if (key === 'ex6Dir') return st.ex6Dir === 0 ? '沿 AB' : '沿 CD';
      return st[key] ? '开' : '关';
    }
    var a = it.a, v = st[key], unit = a.unit ? ' ' + a.unit : '';
    switch (key) {
      case 'demoS': case 'lawS': case 'tblS': return P.fmt(v, 1) + ' mm²';
      case 'lawRho': case 'matA': case 'matD': case 'tblMat': case 'wdMat': return P.RHO_ORDER[v];
      case 'demoL': return P.fmt(v, 0) + ' m';
      case 'wdL': return P.fmt(v, 2) + ' m';
      case 'wdS': return P.fmt(v, 1) + ' mm²';
      case 'rhX': return P.fmt(v, 2);
      case 'lawL': return P.fmt(v, 2) + ' m';
      case 'tblL': return P.fmt(v, 1) + ' m';
      case 'lenB': case 'areaC': case 'ex5k': return P.fmt(v, 2) + ' ×';
      case 'heatT': return P.fmt(v, 0) + ' ℃';
      case 'scT': case 'scTc': return P.fmt(v, 0) + ' K';
      case 'dioU': case 'dioTh': return P.fmt(v, 2) + ' V';
      case 'ex1Pt': return ['A', 'B', 'C', 'D'][v];
      case 'ex2L': return P.fmt(v * 100, 0) + ' cm';
      case 'chainP': return P.fmt(v, 0) + ' / 4';
      case 'ex6a': case 'ex6b': return P.fmt(v, 2) + ' m';
      default: return P.fmt(v, a.step < 1 ? 2 : 0) + unit;
    }
  }
  function setParam(key, v) {
    st[key] = v;
    var A = global.RANIM;
    if (A) A.hold(3.5);
    draw();
  }
  function toggleParam(key) {
    if (key === 'cvMode') st.cvMode = (st.cvMode + 1) % 3;
    else st[key] = st[key] ? 0 : 1;
    var A = global.RANIM;
    if (A) A.hold(3.5);
    draw();
  }
  function setByFraction(key, f, invert) {
    var a = (CTRL.items[key] || {}).a;
    if (!a || a.kind === 'toggle') return;
    var g = invert ? 1 - clamp(f, 0, 1) : clamp(f, 0, 1);
    var v = a.min + (a.max - a.min) * g;
    v = Math.round(v / a.step) * a.step;
    setParam(key, v);
  }

  function buildToc() {
    var host = $('toc'), lastAct = null, wrap = null;
    STEPS.forEach(function (d, i) {
      if (d.act !== lastAct) {
        lastAct = d.act;
        wrap = document.createElement('div'); wrap.className = 'grp';
        var lab = document.createElement('span'); lab.className = 'glab'; lab.textContent = ACTS[d.act].name;
        wrap.appendChild(lab); host.appendChild(wrap);
      }
      var btn = document.createElement('button');
      btn.className = 'tk'; btn.textContent = String(i + 1); btn.title = d.title; btn.dataset.i = i;
      btn.addEventListener('click', function () { go(i); });
      wrap.appendChild(btn);
    });
  }
  function markToc() {
    var bs = $('toc').querySelectorAll('.tk');
    for (var i = 0; i < bs.length; i++) bs[i].className = 'tk' + (+bs[i].dataset.i === st.step ? ' on' : '');
  }
  function updateControls() {
    $('btnPrev').disabled = st.step === 0;
    $('btnNext').disabled = st.step === STEPS.length - 1;
    $('progFill').style.width = ((st.step + 1) / STEPS.length * 100).toFixed(2) + '%';
  }

  function go(i) {
    if (i < 0 || i >= STEPS.length) return;
    var A = global.RANIM;
    if (A) { A.hold(0.8); A.beginStep(); }
    apply(st, i);
    draw();
    if (A && !A.frozen) startAnim(); else if (global.requestAnimationFrame) global.requestAnimationFrame(draw);
  }
  function next() { go(st.step + 1); }
  function prev() { go(st.step - 1); }
  function resetStep() {
    var A = global.RANIM;
    if (A) { A.hold(0.8); A.beginStep(); }
    go(st.step);
  }

  function canvasClick(ev) {
    var r = cv.getBoundingClientRect();
    var u = (ev.clientX - r.left) / r.width;
    var v = (ev.clientY - r.top) / r.height;
    var h = HD.hit(STEPS[st.step].scene, u, v);
    if (!h) { CLICK.msg = ''; CLICK.kind = ''; updatePanel(); return; }
    var fn = ACT[h.act];
    if (fn) fn();
    else { CLICK.kind = 'poke'; CLICK.msg = h.note || ''; draw(); }
  }

  var drag = null, downAt = null;
  function firstRangeKey() {
    var allow = STEPS[st.step].allow || {};
    var keys = Object.keys(allow);
    for (var i = 0; i < keys.length; i++) if (allow[keys[i]].kind !== 'toggle') return keys[i];
    return null;
  }
  function pos(ev) {
    var r = cv.getBoundingClientRect();
    var t = ev.touches ? ev.touches[0] : ev;
    return { x: t.clientX - r.left, y: t.clientY - r.top, w: r.width, h: r.height };
  }
  function startDrag(ev) {
    var t = ev.touches ? ev.touches[0] : ev;
    mDown = true;
    var A = global.RANIM;
    if (A) A.hold(3.5);
    downAt = { x: t.clientX, y: t.clientY, moved: false };
    var key = firstRangeKey();
    if (!key) return;
    drag = key;
    ev.preventDefault();
    moveDrag(ev);
  }
  function moveDrag(ev) {
    var t = ev.touches ? ev.touches[0] : ev;
    if (downAt && Math.hypot(t.clientX - downAt.x, t.clientY - downAt.y) > 5) downAt.moved = true;
    if (!drag) return;
    var p = pos(ev);
    setByFraction(drag, p.x / p.w);
  }
  function endDrag(ev) {
    if (downAt && !downAt.moved && ev && ev.clientX != null) canvasClick(ev);
    else if (downAt && !downAt.moved && ev && ev.changedTouches && ev.changedTouches[0]) {
      canvasClick({ clientX: ev.changedTouches[0].clientX, clientY: ev.changedTouches[0].clientY });
    }
    drag = null; downAt = null; mDown = false;
  }

  function key(ev) {
    if (ev.target && /INPUT|TEXTAREA|BUTTON/.test(ev.target.tagName)) return;
    if (ev.key === ' ' && !ev.shiftKey) { togglePlay(); ev.preventDefault(); return; }
    if (ev.key === 'ArrowRight' || ev.key === 'PageDown') { next(); ev.preventDefault(); }
    else if (ev.key === 'ArrowLeft' || ev.key === 'PageUp') { prev(); ev.preventDefault(); }
    else if (ev.key === 'Home') go(0);
    else if (ev.key === 'End') go(STEPS.length - 1);
    else if (ev.key === 'r' || ev.key === 'R') resetStep();
    else if (ev.key === 's' || ev.key === 'S') stopAll();
  }

  function hash() {
    var A = global.RANIM;
    var sv = A ? { frozen: A.frozen, playing: A.playing, t: A.t, stepT: A.stepT } : null;
    if (A) { A.frozen = true; A.t = 3.0; A.stepT = 99; draw(); }
    if (!lastFit) draw();
    var d = ctx.getImageData(0, 0, cv.width, cv.height).data;
    var h = 2166136261 >>> 0;
    for (var i = 0; i < d.length; i += 61) { h ^= d[i]; h = (h * 16777619) >>> 0; }
    var out = ('00000000' + h.toString(16)).slice(-8);
    if (A && sv) {
      A.frozen = sv.frozen; A.playing = sv.playing; A.t = sv.t; A.stepT = sv.stepT;
      if (A.playing) A.startLoop();

      });
      var pts = [[0, 0], [100, 0]];
      var p1 = Z.pathAt(pts, 0.2), p2 = Z.pathAt(pts, 0.7);
      var ok2 = Math.abs(p1.x - 20) < 1e-6 && Math.abs(p2.x - 70) < 1e-6;
      Rz.push({ name: '路径插值 pathAt', got: p1.x + '/' + p2.x, want: '20/70', ok: ok2 });
      if (!ok2) fails.push(Rz[Rz.length - 1]);
      A.t = svT; A.playing = svP; A.frozen = svF;
      if (A.playing) A.startLoop();
      return { pass: fails.length === 0, total: Rz.length, failed: fails.length, results: Rz, fails: fails };
    },

    verifyAnimReq: function () {
      var A = global.RANIM, Rz = [], fails = [];
      function chk(name, ok, got, want) {
        Rz.push({ name: name, got: got, want: want, ok: !!ok });
        if (!ok) fails.push(Rz[Rz.length - 1]);
      }
      var sv = { t: A.t, playing: A.playing, frozen: A.frozen, hold: A.holdUntil };
      A.frozen = false; A.playing = true; A.holdUntil = 0; A.t = 4;
      A.pause();
      var t0 = A.t, h0 = hash();
      A.tick(0.8);
      var t1 = A.t, h1 = hash();
      chk('暂停后时钟不推进', Math.abs(t1 - t0) < 1e-12, t1 - t0, '0');
      chk('暂停后画面逐字节相同', h1 === h0, h1, h0);
      A.t = 9; A.play(); A.stop();
      chk('停止后时钟归零', A.t === 0, A.t, 0);
      chk('停止后不再播放', A.playing === false, A.playing, false);
      A.t = sv.t; A.playing = sv.playing; A.frozen = sv.frozen; A.holdUntil = sv.hold;
      if (A.playing) A.startLoop();
      draw();
      return { pass: fails.length === 0, total: Rz.length, failed: fails.length, results: Rz, fails: fails };
    },

    verifySpeed: function () {
      var Rz = [], fails = [];
      function chk(name, ok, got, want) {
        Rz.push({ name: name, got: got, want: want, ok: !!ok });
        if (!ok) fails.push(Rz[Rz.length - 1]);
      }
      var sv = { step: st.step, demoS: st.demoS, demoL: st.demoL };
      st.step = 0; st.demoS = 1; st.demoL = 50;
      var a = derive(st);
      st.demoS = 4;
      var b = derive(st);
      chk('S 变 4 倍 ⇒ 导线电阻 R 变 1/4（R = ρL/S）', Math.abs(a.R_demo / b.R_demo - 4) < 1e-9,
        a.R_demo / b.R_demo, 4);
      chk('导线越粗 ⇒ 损耗占比越小', b.lossFrac < a.lossFrac, b.lossFrac.toFixed(4), '< ' + a.lossFrac.toFixed(4));
      chk('导线越粗 ⇒ 电流越大（屏幕相位推进更快）', b.vPxRaw > a.vPxRaw,
        b.vPxRaw.toFixed(2), '> ' + a.vPxRaw.toFixed(2));
      st.demoS = 1; st.demoL = 100;
      var c = derive(st);
      chk('L 加倍 ⇒ 导线电阻 R 加倍', Math.abs(c.R_demo / a.R_demo - 2) < 1e-9, c.R_demo / a.R_demo, 2);
      chk('导线越长 ⇒ 损耗占比越大', c.lossFrac > a.lossFrac, c.lossFrac.toFixed(4), '> ' + a.lossFrac.toFixed(4));
      chk('损耗占比 = R线/(R线+R负载)',
        Math.abs(a.lossFrac - a.R_demo / (a.R_demo + 5)) < 1e-12, a.lossFrac, a.R_demo / (a.R_demo + 5));
      st.step = sv.step; st.demoS = sv.demoS; st.demoL = sv.demoL;
      return { pass: fails.length === 0, total: Rz.length, failed: fails.length, results: Rz, fails: fails };
    },

    verifyTap: function () {
      var Rz = [], fails = [], scenes = Object.keys(HD.HOTSPOTS);
      var i, j;
      for (i = 0; i < STEPS.length; i++) {
        var sc = STEPS[i].scene, list = HD.HOTSPOTS[sc] || [];
        for (j = 0; j < list.length; j++) {
          var h = list[j];
          var got = HD.hit(sc, h.x + h.w / 2, h.y + h.h / 2);
          var ok = got === h && typeof ACT[h.act] === 'function';
          Rz.push({ step: i + 1, scene: sc, label: h.label, hit: !!got, act: typeof ACT[h.act] === 'function', ok: ok });
          if (!ok) fails.push(Rz[Rz.length - 1]);
        }
      }

      for (i = 0; i < STEPS.length; i++) {
        var has = (HD.HOTSPOTS[STEPS[i].scene] || []).length > 0;
        Rz.push({ step: i + 1, scene: STEPS[i].scene, label: '场景有热区', ok: has });
        if (!has) fails.push(Rz[Rz.length - 1]);
      }
      return { pass: fails.length === 0, total: Rz.length, failed: fails.length, results: Rz, fails: fails };
    },
    selfTest: function () { return P.runSelfTest(); },
    stepMeta: function () {
      return STEPS.map(function (d, i) {
        return { i: i, act: d.act, title: d.title, scene: d.scene, allow: Object.keys(d.allow || {}), hint: d.hint || '' };
      });
    },
    consistency: function () {
      var fwd = [], bwd = [], out = [], i;
      for (i = 0; i < STEPS.length; i++) { go(i); fwd.push(hash()); }
      for (i = STEPS.length - 1; i >= 0; i--) { go(i); bwd[i] = hash(); }
      for (i = 0; i < STEPS.length; i++) if (fwd[i] !== bwd[i]) out.push({ step: i, fwd: fwd[i], bwd: bwd[i] });
      return { steps: STEPS.length, mismatches: out.length, detail: out };
    },

    sweep: function () {
      var bad = [], i;
      var sv = st.step;
      for (i = 0; i < STEPS.length; i++) {
        go(i);
        var o = derive(st);
        ['R_demo', 'I_demo', 'R_law', 'R_tbl', 'R_heat', 'I_nl', 'R_nl', 'Uloss_ex3', 'Ubird_ex4'].forEach(function (k) {
          if (o[k] != null && !isFinite(o[k])) bad.push({ step: i + 1, key: k, v: o[k] });
        });
      }
      st.step = sv;
      return { steps: STEPS.length, bad: bad.length, detail: bad };
    }
  };

  var SPEEDS = [0.5, 1, 1.6, 2.4], speedIdx = 1;
  function syncPlayBtn() {
    var A = global.RANIM;
    var b = $('btnPlay');
    if (b) {
      b.textContent = (A && A.playing) ? '❚❚ 暂停' : '▶ 播放';
      b.classList.toggle('on', !!(A && A.playing));
    }
    var s2 = $('btnSpeed');
    if (s2) s2.textContent = (A ? A.speed : 1).toFixed(1) + '×';
  }
  function togglePlay() {
    var A = global.RANIM;
    if (!A) return;
    if (A.playing) A.pause(); else A.play();
    syncPlayBtn(); draw();
  }
  function stopAll() {
    var A = global.RANIM;
    if (!A) return;
    A.stop();
    syncPlayBtn(); draw();
  }
  function cycleSpeed() {
    var A = global.RANIM;
    if (!A) return;
    speedIdx = (speedIdx + 1) % SPEEDS.length;
    A.speed = SPEEDS[speedIdx];
    syncPlayBtn();
  }
  $('btnPlay').addEventListener('click', togglePlay);
  $('btnStop').addEventListener('click', stopAll);
  $('btnSpeed').addEventListener('click', cycleSpeed);
  syncPlayBtn();

  $('btnNext').addEventListener('click', next);
  $('btnPrev').addEventListener('click', prev);
  $('btnReset').addEventListener('click', resetStep);
  $('prog').addEventListener('click', function (ev) {
    var r = this.getBoundingClientRect();
    go(Math.floor(clamp((ev.clientX - r.left) / r.width, 0, 0.999) * STEPS.length));
  });
  cv.addEventListener('mousedown', startDrag);
  cv.addEventListener('touchstart', startDrag, { passive: false });
  global.addEventListener('mousemove', moveDrag);
  global.addEventListener('touchmove', moveDrag, { passive: false });
  global.addEventListener('mouseup', endDrag);
  global.addEventListener('touchend', endDrag);
  global.addEventListener('keydown', key);
  global.addEventListener('resize', function () { draw(); });

  buildToc();
  apply(st, 0);
  draw();
  setTimeout(draw, 80);
  startAnim();
  if (global.RANIM) global.RANIM.playing = true;
  global.addEventListener('pointerdown', function () { var A = global.RANIM; if (A) A.hold(3.5); }, true);
  global.addEventListener('pointerup', function () { mDown = false; }, true);
})(typeof window !== 'undefined' ? window : globalThis);
</script>
</body>
</html>
